<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <!--
      Trois déclarations, du repli le plus large au format préféré : le .ico
      couvre les navigateurs qui ignorent le SVG, le SVG reste net à toute
      taille, et l'apple-touch-icon sert d'icône quand le site est ajouté à
      l'écran d'accueil iOS (qui ne sait pas lire un favicon SVG).
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
      Signale au navigateur que le site gère lui-même clair/sombre (via la
      classe .dark, voir Main.css). Sans ça, certains navigateurs appliquent
      leur propre "assombrissement forcé" aux zones sans couleur de fond
      explicite (transparentes, héritées du body) : un bleu-gris générique
      qui n'a rien à voir avec la palette du site vient alors recouvrir ces
      zones par-dessus nos couleurs.
    -->
    <meta name="color-scheme" content="light dark">

    <!--
      Applique le thème et la police avant le premier paint.
      Sans ça, les visiteurs en mode sombre voient un flash clair à chaque
      chargement, le temps que Vue soit monté.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement
          var saved = localStorage.getItem('theme')
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            root.classList.add('dark')
          }
          if (localStorage.getItem('font-preference') === 'dys') {
            root.classList.add('font-dys')
          }
        } catch (e) {
          /* localStorage indisponible (navigation privée stricte) : on garde le thème clair. */
        }
      })()
    </script>

    <title>Bastien Roc - Freelance AMOA, conduite du changement & IA</title>

    <!-- Polices auto-hébergées (voir Main.css) : aucune requête vers un
         domaine tiers, donc aucune donnée de visiteur transmise hors UE.
         Un seul fichier par famille depuis le sous-ensemblage. -->
    <link rel="preload" href="/fonts/lexend.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>

    <!-- SEO — valeurs par défaut, mises à jour par route via useSeo() -->
    <meta name="description" content="J'accompagne vos projets de transformation digitale du cadrage jusqu'à l'adoption réelle par les équipes : AMOA, conduite du changement, pilotage agile et IA.">
    <meta name="author" content="Bastien Roc">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="%SITE_URL%/">

    <!-- Open Graph (LinkedIn, Facebook, WhatsApp) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="%SITE_URL%/">
    <meta property="og:title" content="Bastien Roc - Freelance AMOA, conduite du changement & IA">
    <meta property="og:description" content="Prestations indépendantes en transformation digitale : AMOA & cadrage, conduite du changement, pilotage agile et IA & automatisation.">
    <meta property="og:image" content="%SITE_URL%/og-image.jpg">
    <meta property="og:locale" content="fr_FR">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Bastien Roc - Freelance AMOA, conduite du changement & IA">
    <meta name="twitter:description" content="Prestations indépendantes en transformation digitale : AMOA, conduite du changement, pilotage agile et IA & automatisation.">
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg">

    <!--

      LocalBusiness, qui impliqueraient une entité commerciale immatriculée.
      À faire évoluer une fois le SIRET obtenu.
    -->

      "name": "Bastien Roc",
      "url": "%SITE_URL%/",
      "jobTitle": "Manager de la Transformation Digitale",
      "email": "mailto:contact@bastienroc.fr",
      "image": "%SITE_URL%/og-image.jpg",
      "sameAs": [
        "https://www.linkedin.com/in/bastien-roc/",
        "https://github.com/bastienR17"
      ],
      "knowsAbout": [
        "AMOA",
        "Conduite du changement",
        "Gestion de projet agile",
        "Scrum",
        "Intelligence artificielle",
        "Automatisation des processus",
        "Transformation digitale"
      ],
      "makesOffer": [
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "AMOA & Cadrage",
            "description": "Traduction d'un besoin métier en projet pilotable et coordination entre équipes métier et techniques."
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Conduite du changement",
            "description": "Accompagnement de l'adoption d'un nouvel outil ou d'une nouvelle organisation, du plan de communication à la mesure de l'adoption."
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Pilotage de projet agile",
            "description": "Structuration et facilitation de projets en méthode agile, animation des rituels et priorisation du backlog."
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "IA & Automatisation",
            "description": "Déploiement d'assistants IA documentaires et automatisation de processus métier."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
